<section class="author{% if site.disqus == false %} no-disqus{% endif %}">
    <div class="grid gap-6 md:grid-cols-12 md:items-center">
        <div class="flex items-center justify-center md:col-span-2">
            <figure class="h-32 w-32">
              <img class="h-32 w-32 rounded-full object-cover" src="{% if site.authors[page.author].external-image == true %}{{ site.authors[page.author].picture }}{% else %}{{ site.url }}/{{ site.authors[page.author].picture }}{% endif %}" alt="{{ site.authors[page.author].name }}"/>
            </figure>
        </div>
        <div class="text-center md:col-span-10 md:text-left">
            <h2 class="text-2xl font-semibold text-ink mb-1">{{ site.authors[page.author].name }}</h2>
            <p class="text-xl font-normal text-body">{{ site.authors[page.author].bio }}</p>

            <div class="mt-4 flex flex-wrap justify-center gap-2 md:justify-start">
                {% if site.authors[page.author].twitter %}
                <a class="btn btn-small btn-info" aria-label="Compartilhar no Twitter" href="https://twitter.com/intent/tweet?text={{ site.url }}{{ page.url }} - {{ page.title }} by @{{ site.authors[page.author].twitter }}">
                    <span class="icon icon-sm" aria-hidden="true"><i class="fab fa-twitter" aria-hidden="true"></i></span>
                    <span>Tweetar</span>
                </a>
                {% endif %}
                <button type="button" class="btn btn-small btn-link" onclick="window.open('https://facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href), 'facebook-share-dialog', 'width=626,height=436'); return false;">
                    <span class="icon icon-sm" aria-hidden="true"><i class="fab fa-facebook-square" aria-hidden="true"></i></span>
                    <span>Compartilhar</span>
                </button>
            </div>
        </div>
    </div>
</section>
