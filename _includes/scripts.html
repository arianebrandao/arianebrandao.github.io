<!-- Scripts -->
{% raw %}
<script>
	document.addEventListener('DOMContentLoaded', () => {
		document.querySelectorAll('[data-toggle-navbar]').forEach((button) => {
			button.addEventListener('click', () => {
				const target = document.getElementById(button.dataset.toggleNavbar);
				if (!target) return;
				const isHidden = target.classList.toggle('hidden');
				button.setAttribute('aria-expanded', String(!isHidden));
				button.setAttribute('aria-label', isHidden ? 'Abrir menu' : 'Fechar menu');
			});
		});
	});
</script>
{% endraw %}
<script src="{{ '/assets/js/lazysizes.min.js' | relative_url }}" defer></script>

{% if page.title == "Home" %}
	{% raw %}
		<script src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
  		<script src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
  		<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
		<script>
			function mOver() {
			  document.getElementById("highlighted-customers").innerHTML = "Alguns clientes ;)";
			}
			function mOut() {
			  document.getElementById("highlighted-customers").innerHTML = "Alguns clientes :)";
			}
			
			$(document).ready(function(){
				const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				const $carousel = $('.autoplay');
				let playing = !reduceMotion;

				$carousel.slick({
				  slidesToShow: 4,
				  slidesToScroll: 1,
				  autoplay: playing,
				  autoplaySpeed: 2000,
				  arrows: false,
				});

				const toggle = document.getElementById('carousel-toggle');
				if (toggle) {
				  const sync = () => {
				    toggle.textContent = playing ? 'Pausar carrossel' : 'Reproduzir carrossel';
				  };
				  sync();
				  toggle.addEventListener('click', () => {
				    playing = !playing;
				    $carousel.slick(playing ? 'slickPlay' : 'slickPause');
				    sync();
				  });
				}
			});
		</script>
	{% endraw %}
{% endif %}
