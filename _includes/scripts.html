<!-- Scripts -->
{% raw %}
<script>
	document.addEventListener('DOMContentLoaded', () => {
		document.querySelectorAll('[data-toggle-navbar]').forEach((button) => {
			button.addEventListener('click', () => {
				const target = document.getElementById(button.dataset.toggleNavbar);
				if (!target) return;
				const isHidden = target.classList.toggle('hidden');
				button.setAttribute('aria-expanded', String(!isHidden));
			});
		});
	});
</script>
{% endraw %}
<script src="{{ '/assets/js/lazysizes.min.js' | relative_url }}" defer></script>

{% if page.title == "Home" %}
	{% raw %}
		<script src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
  		<script src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
  		<script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
		<script>
			function mOver() {
			  document.getElementById("highlighted-customers").innerHTML = "Alguns clientes ;)";
			}
			function mOut() {

			}
			
			$(document).ready(function(){
